<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>The wall — Brandon Strittmatter</title>
    <meta name="description" content="Notes and doodles people have left on burcs.dev." />
    <link rel="canonical" href="https://burcs.dev/wall/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="burcs.dev" />
    <meta property="og:title" content="The wall" />
    <meta property="og:description" content="Notes and doodles people have left on burcs.dev." />
    <meta property="og:url" content="https://burcs.dev/wall/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:creator" content="@burcs" />
    <link rel="alternate" type="application/rss+xml" title="burcs.dev" href="/rss.xml" vite-ignore />
    <link rel="preload" href="/fonts/BrandonPencil-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <!-- The theme before first paint, the same way main.js picks it, so a
         dark desk doesn't flash light on every load. And if the font or the
         scripts are slow to arrive, show the page anyway after 3s. -->
    <script>
      setTimeout(() => document.documentElement.classList.add("ready"), 3000);
      try {
        const t = new URLSearchParams(location.search).get("theme") || JSON.parse(localStorage.getItem("scene") || "{}").theme;
        document.documentElement.dataset.theme = ["light", "dark"].includes(t) ? t : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      } catch {}
    </script>
    <noscript><style>.sheet { opacity: 1; }</style></noscript>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="gl" aria-hidden="true"></canvas>

    <!-- Notes visitors have pinned up and Brandon has approved, filled in by
         src/wall.js. -->
    <main class="desk">
      <article class="sheet wall-sheet" id="sheet">
        <div class="head">
          <h1><a href="/"><span aria-hidden="true">← </span>The wall</a></h1>
        </div>

        <p>
          Notes and doodles people have left here. Draw on this page; I read
          each one before it goes up.
        </p>

        <nav class="tools" aria-label="Write on this page">
          <button type="button" class="tool" data-tool="doodle">doodle</button>
          <button type="button" class="tool" data-tool="pin">Save doodle</button>
        </nav>
        <div class="wall-notes"></div>
        <nav class="wall-pages" aria-label="Wall pages"></nav>
      </article>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
